<!doctype html>
<!--
  Offline harness for depok-map's map-layer code.

  The sandbox browser cannot load the OpenFreeMap style (MapLibre's own request
  path returns an empty body even though a plain fetch of the same URL returns
  200 with 25 KB), so the real app's `load` event never fires and every layer
  code path silently no-ops behind its `if (!map.getSource(...)) return` guard.

  This harness loads app.js against a trivial inline style — no network at all —
  so `addLayers()` runs and the transport layer can actually be exercised.
  It is a test fixture, not part of the site: nothing links to it.
-->
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>depok-map offline harness</title>
<link rel="stylesheet" href="/src/app.css">
</head>
<body>
  <div class="topbar">
    <div class="search" id="search">
      <input id="q" type="search" autocomplete="off">
      <button id="clear" type="button" hidden>x</button>
      <div id="results" hidden></div>
    </div>
  </div>
  <div id="map"></div>
  <button id="side-toggle" type="button">menu</button>
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="side-tabs" role="tablist">
        <button class="side-tab is-on" id="tab-area" type="button">Wilayah</button>
        <button class="side-tab" id="tab-road" type="button">Jalan</button>
        <button class="side-tab" id="tab-transport" type="button">Transportasi</button>
      </div>
      <button id="theme" class="side-theme" type="button">t</button>
      <button class="side-close" id="side-close" type="button">x</button>
    </div>
    <div class="side-panel" id="panel-area">
      <p class="side-note" id="area-note"></p>
      <div class="side-locate" id="side-locate" hidden>
        <button class="locate-btn" id="locate-btn" type="button"></button>
        <span class="locate-text" id="locate-text"></span>
      </div>
      <div class="side-scroll" id="area-list"></div>
    </div>
    <div class="side-panel" id="panel-road" hidden>
      <div class="side-scroll" id="road-scroll">
        <p class="side-note" id="road-note"></p>
        <div id="road-groups"></div>
      </div>
    </div>
    <div class="side-panel" id="panel-transport" hidden>
      <div class="side-scroll" id="transport-scroll">
        <p class="side-note" id="transport-note"></p>
        <div id="transport-groups"></div>
      </div>
    </div>
  </aside>
  <div class="road-note-card" id="transport-card" hidden>
    <div class="rnc-text">
      <span class="rnc-klas" id="transport-card-ref"></span>
      <span class="rnc-name" id="transport-card-name"></span>
    </div>
    <button class="rnc-x" id="transport-card-x" type="button">x</button>
  </div>
  <div class="road-note-card" id="road-card" hidden>
    <div class="rnc-text">
      <span class="rnc-klas" id="road-card-klas"></span>
      <span class="rnc-name" id="road-card-name"></span>
    </div>
    <button class="rnc-x" id="road-card-x" type="button">x</button>
  </div>
  <button id="back" class="back" hidden><span></span></button>
  <div class="card" id="card"></div>
  <div class="legend" id="legend" hidden></div>
  <footer class="attrib" id="attrib"></footer>

<script>
// Intercept the basemap style request and answer it locally.
//
// app.js declares its own `const STYLES`, so assigning window.STYLES is shadowed
// and cannot help. MapLibre v5 loads a style *URL* through fetch(), not XHR — an
// earlier XHR-only stub here saw zero requests, which is how that was found.
// It still uses XHR for tiles/glyphs/sprites, so both are patched: fetch for the
// style, XHR for everything else, so the errors stay obvious instead of
// silently timing out.
window.__net = [];
(function () {
  var STYLE = {
    version: 8,
    sources: {},
    layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#eef1ee' } }],
  };
  var STYLE_URL = /openfreemap\.org\/styles/;

  var of = window.fetch;
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    if (STYLE_URL.test(url)) {
      window.__net.push('fetch-stub ' + url);
      return Promise.resolve(new Response(JSON.stringify(STYLE), {
        status: 200,
        headers: { 'content-type': 'application/json' },
      }));
    }
    window.__net.push('fetch ' + url);
    return of.apply(this, arguments);
  };

  var XO = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (m, u) {
    this.__url = String(u);
    window.__net.push('xhr ' + this.__url);
    return XO.apply(this, arguments);
  };
})();
</script>
<script src="/vendor/maplibre-gl.js"></script>
<script>
// Offline stub for maplibregl.Map.
//
// MapLibre cannot initialise in this sandbox: even a fresh Map with a trivial
// inline style never fires `styledata` or `load` (verified — workers and WebGL
// are available, so it is not those). Since the app only ever touches a small
// set of Map methods, recording them lets app.js's real layer/selection logic
// be exercised end to end without a renderer.
window.__calls = [];
function Rec(rec) { return function () { window.__calls.push([rec].concat([].slice.call(arguments))); }; }

maplibregl.Map = function (opts) {
  var self = this;
  this._layers = {};
  this._sources = {};
  this._srcData = {};
  this.getStyle = Rec('getStyle');
  this.fitBounds = function (b, o) { self._lastFit = [b, o]; window.__calls.push(['fitBounds', b, o]); };
  this.resize = Rec('resize');
  this.project = function (lnglat) { return { x: 0, y: 0 }; };
  this.unproject = function (p) { return { lng: 0, lat: 0 }; };
  this.getBounds = function () { return [[106.7, -6.46], [106.92, -6.31]]; };
  this.getCenter = function () { return { lng: 106.82, lat: -6.39 }; };
  this.getZoom = function () { return 11; };
  this.queryRenderedFeatures = function () { return []; };
  this.queryTerrainElevation = function () { return 0; };
  this.setTerrain = Rec('setTerrain');
  this.isTerrainEnabled = function () { return false; };
  this.easeTo = Rec('easeTo');
  this.jumpTo = Rec('jumpTo');
  this.setFilter = Rec('setFilter');
  this.on = function () { return self; };
  this.off = function () { return self; };
  this.once = function () { return self; };
  this.fire = function () { return self; };
  this.triggerRepaint = Rec('triggerRepaint');
  this.remove = Rec('remove');
  this.addControl = function () {};
  this.addSource = function (id, src) { self._sources[id] = src; window.__calls.push(['addSource', id]); };
  this.getSource = function (id) { return self._sources[id]; };
  this.removeSource = function (id) { delete self._sources[id]; window.__calls.push(['removeSource', id]); };
  this.addLayer = function (l, before) { self._layers[l.id] = l; window.__calls.push(['addLayer', l.id]); };
  this.getLayer = function (id) { return self._layers[id]; };
  this.removeLayer = function (id) { delete self._layers[id]; window.__calls.push(['removeLayer', id]); };
  this.moveLayer = Rec('moveLayer');
  this.setPaintProperty = function (id, p, v) { window.__calls.push(['setPaintProperty', id, p, v]); };
  this.setLayoutProperty = function (id, p, v) { window.__calls.push(['setLayoutProperty', id, p, v]); };
  this.setLayerZoomRange = Rec('setLayerZoomRange');
  this.loadImage = Rec('loadImage');
  this.addImage = Rec('addImage');
  this.hasImage = function () { return false; };
  this.getCanvas = function () { return document.createElement('canvas'); };
  this.getContainer = function () { return document.getElementById('map'); };
  this.getBounds = function () { return [[106.7, -6.46], [106.92, -6.31]]; };
  this.project = function () { return { x: 0, y: 0 }; };
  this.unproject = function () { return { lng: 0, lat: 0 }; };
  // GeoJSON sources must expose setData — app.js calls it on the source object
  // returned by getSource(). Missing this is what made highlightRoute silently
  // stop after its guards.
  this.addSource = function (id, src) {
    self._sources[id] = src;
    if (src && src.type === 'geojson') {
      self._sources[id].setData = function (d) {
        self._srcData[id] = d;
        window.__calls.push(['setData', id, d && d.features ? d.features.length : 0]);
      };
    }
    window.__calls.push(['addSource', id]);
  };
  // app.js registers map.on('load', addLayers). Fire it once listeners attach.
  self._handlers = {};
  self.on = function (ev, fn) { (self._handlers[ev] = self._handlers[ev] || []).push(fn); return self; };
  self.off = function () { return self; };
  self.once = function (ev, fn) { return self.on(ev, fn); };
  self.fire = function (ev, arg) {
    (self._handlers[ev] || []).forEach(function (f) { f(arg || {}); });
    return self;
  };
  window.__map = self;
  window.__net.push('stub map constructed');
};
maplibregl.Map.prototype.addClass = function () {};
maplibregl.Map.prototype.removeClass = function () {};
maplibregl.NavigationControl = function () {};
maplibregl.ScaleControl = function () {};
maplibregl.Popup = function () { this.setLngLat = function(){return this;}; this.setHTML = function(){return this;};
  this.setText = function(){return this;}; this.addTo = function(){return this;}; this.remove = function(){}; };
maplibregl.LngLatBounds = function (a, b) { this.extend = function () { return this; }; };
</script>
<script src="/src/data.js"></script>
<script src="/src/roads.js"></script>
<script src="/src/transport.js"></script>
<script src="/src/app.js"></script>
<script>
// The stub never receives a real `load`, so replay it once the module has run.
setTimeout(function () {
  if (window.__map) { window.__map.fire('load'); window.__net.push('fired load'); }
}, 400);
</script>
<script>
// Expose the map for assertions.
setTimeout(function () {
  var c = document.getElementById('map');
  // app.js keeps `map` module-scoped; reach it through the canvas container.
  window.__harness = { loaded: !!(c && c.querySelector('canvas')) };
}, 500);
</script>
</body>
</html>
