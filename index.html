<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>depok-map — peta wilayah Kota Depok</title>
<meta name="description" content="Peta interaktif Kota Depok: pilih kecamatan untuk melihat kelurahan di dalamnya. 63 kelurahan dalam 11 kecamatan, lengkap dengan administrative hierarchy dan kode BPS.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f6f3">
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/src/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6f4f'/%3E%3Cpath d='M8 9l4.5 15L16 15l3.5 9L24 9' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<a class="skip" href="#search">Lompat ke pencarian</a>

<div id="map" role="application" aria-label="Peta wilayah Kota Depok"></div>

<!-- top bar: sidebar toggle + search, on one level -------------------- -->
<div class="topbar">
  <button id="side-toggle" class="side-toggle" type="button" aria-expanded="false"
          aria-controls="sidebar" aria-label="Buka daftar wilayah dan jalan">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h10"/>
    </svg>
    <span>Daftar</span>
  </button>

  <div class="search" id="search">
    <div class="search-box">
      <svg class="i-search" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
      </svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Cari kecamatan atau kelurahan…"
             aria-label="Cari kelurahan atau kecamatan di Kota Depok"
             aria-expanded="false" aria-controls="results" role="combobox"
             aria-autocomplete="list">
      <button id="clear" class="clear" type="button" aria-label="Hapus pencarian" hidden>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
      <button id="theme" class="theme" type="button" aria-label="Ganti tema" title="Ganti tema terang/gelap">
        <svg class="i-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/>
        </svg>
        <svg class="i-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M20 14.2A8.4 8.4 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2z"/>
        </svg>
      </button>
    </div>
    <p class="search-meta" id="search-meta">11 kecamatan · 63 kelurahan · Kota Depok</p>
    <ul class="results" id="results" role="listbox" aria-label="Hasil pencarian" hidden></ul>
  </div>

  <!-- Balances the toggle so the search box stays centred on the viewport.
       Kept as an element (not a CSS spacer) so the grid has a third track. -->
  <div class="topbar-tail" aria-hidden="true"></div>
</div>

<!-- sidebar ------------------------------------------------------------ -->
<aside class="sidebar" id="sidebar" aria-label="Daftar wilayah dan jalan">
  <div class="side-head">
    <div class="side-tabs" role="tablist">
      <button class="side-tab is-on" id="tab-area" role="tab" aria-selected="true"
              aria-controls="panel-area" type="button">Wilayah</button>
      <button class="side-tab" id="tab-road" role="tab" aria-selected="false"
              aria-controls="panel-road" type="button">Jalan</button>
    </div>
    <button class="side-min" id="side-min" type="button" aria-expanded="true"
            aria-controls="panel-area" aria-label="Perkecil daftar" title="Perkecil daftar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </button>
    <button class="side-close" id="side-close" type="button" aria-label="Tutup daftar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- areas -->
  <div class="side-panel" id="panel-area" role="tabpanel" aria-labelledby="tab-area">
    <div class="side-scroll" id="area-list"></div>
  </div>

  <!-- roads -->
  <div class="side-panel" id="panel-road" role="tabpanel" aria-labelledby="tab-road" hidden>
    <!-- One scroll container holding both the note and the groups. Two things
         depend on this being a single scroller: the 77 ruas need somewhere to
         scroll (as a direct child of .side-panel they were clipped by the
         panel's overflow:hidden), and the note's `position: sticky` only works
         when it has a scrolling ancestor. roadGroups is rendered into by JS and
         must not be the scroller itself, or that innerHTML write would delete
         the sticky note. -->
    <div class="side-scroll" id="road-scroll">
      <p class="side-note" id="road-note"></p>
      <div id="road-groups"></div>
    </div>
  </div>
</aside>

<!-- selected road banner --------------------------------------------- -->
<div class="road-note-card" id="road-card" hidden>
  <div class="rnc-text">
    <span class="rnc-klas" id="road-card-klas"></span>
    <span class="rnc-name" id="road-card-name"></span>
  </div>
  <button class="rnc-x" id="road-card-x" type="button" aria-label="Hapus pilihan jalan">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
      <path d="M18 6L6 18M6 6l12 12"/>
    </svg>
  </button>
</div>

<!-- back ------------------------------------------------------------- -->
<button id="back" class="back" type="button" hidden>
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
    <path d="M15 5l-7 7 7 7"/>
  </svg>
  <span></span>
</button>

<!-- answer card ------------------------------------------------------- -->
<div class="card" id="card"></div>

<!-- legend ------------------------------------------------------------ -->
<div class="legend" id="legend" hidden>
  <span><i class="sw sel"></i>Terpilih</span>
  <span><i class="sw same"></i>Kecamatan terbuka</span>
</div>

<!-- map controls (maplibre) -->
<div class="geo-note" id="geo-note" hidden>
  <span id="geo-text"></span>
</div>

<footer class="attrib" id="attrib">
  Boundaries © <a href="https://data.humdata.org/dataset/cod-ab-idn" rel="noopener">HDX/BPS</a> ·
  <a href="https://github.com/JfrAziz/indonesia-district" rel="noopener">indonesia-district</a> (CC BY-IGO, 2020) ·
  Map © <a href="https://www.openstreetmap.org/copyright" rel="noopener">OpenStreetMap</a> ·
  <a href="https://openfreemap.org" rel="noopener">OpenFreeMap</a> ·
  Roads: <a href="https://jdih-dprd.depok.go.id/" rel="noopener">Perda Kota Depok No. 9/2022</a> Pasal 16
</footer>

<script src="/vendor/maplibre-gl.js"></script>
<script src="/src/data.js"></script>
<script src="/src/roads.js"></script>
<script src="/src/app.js"></script>
</body>
</html>
